<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Natural Avenue Sdn Bhd - TimeTracker Login</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between antialiased">

  <!-- Top Header Bar -->
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-sm font-semibold tracking-wider text-slate-300 uppercase">Natural Avenue Sdn Bhd</h1>
        <p class="text-2xl font-bold tracking-tight text-white">Time<span class="text-blue-400">Tracker</span></p>
      </div>
      <a href="#" class="text-sm text-slate-300 hover:text-white transition-colors">Login</a>
    </div>
  </header>

  <!-- Main Login Container -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
      
      <!-- Card Header -->
      <div class="bg-slate-50 px-8 py-6 border-b border-slate-200">
        <h2 class="text-xl font-bold text-slate-800">User Login</h2>
        <p class="text-sm text-slate-500 mt-1">Please enter your credentials to access TimeTracker.</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="p-8 space-y-5">
        
        <!-- User Name Field -->
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">User Name:</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter your username"
            class="w-full px-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          />
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password:</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            class="w-full px-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          />
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center">
          <input 
            type="checkbox" 
            id="remember" 
            name="remember" 
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer"
          />
          <label for="remember" class="ml-2.5 block text-sm text-slate-600 cursor-pointer select-none">
            Remember me next time.
          </label>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm hover:shadow transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          >
            Log In
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-400">
    &copy; Natural Avenue Sdn Bhd. All rights reserved.
  </footer>

  <!-- Instant Login Script -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Directly takes you to your dashboard file
      window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
